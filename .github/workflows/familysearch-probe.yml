name: Sonda FamilySearch Manoel Correia

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Playwright
        run: |
          pip install playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Capturar HTML e respostas JSON
        continue-on-error: true
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, json, re, traceback
          from pathlib import Path
          import requests
          from playwright.async_api import async_playwright

          URL='https://ancestors.familysearch.org/pt/LYV6-8M3/manoel-correia-1910-1973'
          out=Path('familysearch_probe'); out.mkdir(exist_ok=True)
          r=requests.get(URL,headers={'User-Agent':'Mozilla/5.0'},timeout=60)
          (out/'requests.html').write_bytes(r.content)
          (out/'requests_headers.json').write_text(json.dumps(dict(r.headers),indent=2,ensure_ascii=False))
          print('requests',r.status_code,len(r.content),r.url)

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              context=await browser.new_context(viewport={'width':1440,'height':1200},locale='pt-BR')
              page=await context.new_page()
              urls=[]
              tasks=[]
              async def save_response(resp, seq):
                u=resp.url
                ct=resp.headers.get('content-type','')
                item={'seq':seq,'url':u,'status':resp.status,'content_type':ct}
                urls.append(item)
                if resp.status==200 and ('json' in ct.lower() or 'javascript' in ct.lower() or any(k in u.lower() for k in ['person','tree-data','ancestor','family','relationship','pedigree'])):
                  try:
                    body=await resp.body()
                    item['bytes']=len(body)
                    if len(body)<20_000_000:
                      safe=re.sub(r'[^A-Za-z0-9._-]+','_',u)[-170:]
                      suffix='.json' if 'json' in ct.lower() else '.bin'
                      (out/f'resp_{seq:04d}_{safe}{suffix}').write_bytes(body)
                  except Exception as e:
                    item['body_error']=repr(e)
              def on_response(resp):
                tasks.append(asyncio.create_task(save_response(resp,len(tasks)+1)))
              page.on('response',on_response)
              nav_error=None
              try:
                await page.goto(URL,wait_until='domcontentloaded',timeout=60000)
              except Exception as e:
                nav_error=repr(e)
              await page.wait_for_timeout(20000)
              try:
                await page.wait_for_load_state('networkidle',timeout=15000)
              except Exception:
                pass
              if tasks:
                await asyncio.gather(*tasks,return_exceptions=True)
              try:
                (out/'page.html').write_text(await page.content(),encoding='utf-8')
                (out/'page_text.txt').write_text(await page.locator('body').inner_text(),encoding='utf-8')
                await page.screenshot(path=str(out/'page.png'),full_page=True)
              except Exception as e:
                (out/'capture_error.txt').write_text(traceback.format_exc(),encoding='utf-8')
              (out/'responses.json').write_text(json.dumps(urls,ensure_ascii=False,indent=2),encoding='utf-8')
              (out/'navigation.json').write_text(json.dumps({'url':page.url,'nav_error':nav_error},ensure_ascii=False,indent=2),encoding='utf-8')
              await browser.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
          grep -RniaE 'João Correia|Joao Correia|Rosa Costa|LYV6-8M3|parent|father|mother|parents|spouse' familysearch_probe > familysearch_probe/grep.txt || true
      - name: Publicar captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familysearch-probe
          path: familysearch_probe/
          retention-days: 7
          if-no-files-found: warn
