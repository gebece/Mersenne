name: HTR rápido dos pais de Manoel

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  parents-htr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Kraken CPU
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1+cpu torchvision==0.19.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install 'kraken==5.3.0' pillow requests
      - name: Preparar folhas e executar reconhecimento em lote
        shell: bash
        run: |
          cat > /tmp/parents_htr.py <<'PY'
          import json,re,requests,subprocess,shlex,unicodedata
          from pathlib import Path
          from PIL import Image,ImageOps,ImageEnhance,ImageFilter

          ROOT=Path('parents-htr'); ROOT.mkdir(exist_ok=True)
          BASE='https://digitarq.arquivos.pt'; DOC='6b8b0d0ff79a456d84d69d3c755a5e79'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 genealogy-research/1.0'})
          # Modelo português histórico
          model=ROOT/'TraPrInq.mlmodel'
          with s.get('https://zenodo.org/records/14538271/files/TraPrInq.mlmodel?download=1',headers={'Referer':'https://zenodo.org/records/14538271'},stream=True,timeout=1200) as r:
            r.raise_for_status()
            with open(model,'wb') as f:
              for ch in r.iter_content(1024*1024):
                if ch:f.write(ch)
          data=s.get(f'{BASE}/api/rdigital/{DOC}?fromIndex=0&max=100000',timeout=120).json()
          recs=[]
          for rec in data.get('results',[]):
            m=re.search(r'_m(\d+)\.',rec.get('name',''))
            if m and 47<=int(m.group(1))<=70: recs.append((int(m.group(1)),rec))
          pairs=[]
          for n,rec in sorted(recs):
            raw=s.get(f'{BASE}/api/rdigital/dissemination?fileId={rec["id"]}',timeout=180).content
            orig=ROOT/f'm{n:04d}.jpg'; orig.write_bytes(raw)
            im=Image.open(orig).convert('L')
            # Corpo completo sem bordas negras; preserva todas as entradas da página.
            body=im.crop((70,80,min(im.width-30,1000),min(im.height-40,1470)))
            body=ImageOps.autocontrast(body,cutoff=.15); body=ImageEnhance.Contrast(body).enhance(1.08); body=body.filter(ImageFilter.UnsharpMask(radius=.7,percent=90,threshold=3))
            inp=ROOT/f'm{n:04d}_body.png'; out=ROOT/f'm{n:04d}.txt'; body.save(inp); pairs.append((inp,out))
          cmd=['kraken']
          for inp,out in pairs: cmd += ['-i',str(inp),str(out)]
          cmd += ['segment','-bl','ocr','-m',str(model)]
          print('RUNNING',len(pairs),'pages',flush=True)
          cp=subprocess.run(cmd,text=True,capture_output=True)
          print('RETURN',cp.returncode,flush=True); print(cp.stdout[-10000:],flush=True); print(cp.stderr[-10000:],flush=True)
          results={}
          terms=['joão','joao','rosa','correia','costa','thom','tomé','tome','manoel','manuel']
          hits=[]
          for inp,out in pairs:
            text=unicodedata.normalize('NFC',out.read_text(encoding='utf-8',errors='replace')) if out.exists() else ''
            results[out.name]=text
            low=text.lower()
            if any(t in low for t in terms): hits.append({'file':out.name,'text':text})
          (ROOT/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'candidate_hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          with open(ROOT/'all_text.txt','w',encoding='utf-8') as f:
            for k,v in results.items(): f.write(f'\n===== {k} =====\n{v}\n')
          print('HITS',json.dumps(hits,ensure_ascii=False)[:20000],flush=True)
          PY
          python /tmp/parents_htr.py
      - name: Publicar HTR dos pais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaifar-parents-htr-fast
          path: parents-htr/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
