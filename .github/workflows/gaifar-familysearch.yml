name: Dados públicos FamilySearch Manoel

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Coletar HTML e dados estruturados públicos
        shell: bash
        run: |
          mkdir -p familysearch
          python - <<'PY'
          import json,re,requests,html
          from pathlib import Path
          urls=[
            'https://ancestors.familysearch.org/pt/LYV6-8M3/manoel-correia-1910-1973',
            'https://ancestors.familysearch.org/en/LYV6-8M3/manoel-correia-1910-1973',
          ]
          out=Path('familysearch')
          report=[]
          for i,u in enumerate(urls):
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125 Safari/537.36'},timeout=120)
            print('HTTP',r.status_code,len(r.content),r.url)
            p=out/f'page_{i}.html'; p.write_bytes(r.content)
            text=r.text
            report.append({'url':u,'http':r.status_code,'bytes':len(r.content),'final':r.url})
            for needle in ['João Correia','Joao Correia','Rosa Costa','LYV6-8M3','1883','1882']:
              print('\nNEEDLE',needle)
              for m in list(re.finditer(re.escape(needle),text,re.I))[:20]:
                a=max(0,m.start()-1000); b=min(len(text),m.end()+1600)
                print(text[a:b].replace('\n',' ')[:3000])
            # IDs FamilySearch no formato XXXX-XXX próximos dos nomes e todos os IDs únicos.
            ids=sorted(set(re.findall(r'\b[A-Z0-9]{4}-[A-Z0-9]{3}\b',text)))
            (out/f'ids_{i}.json').write_text(json.dumps(ids,ensure_ascii=False,indent=2),encoding='utf-8')
            print('IDS',ids)
            # JSON-LD e scripts JSON
            for j,m in enumerate(re.finditer(r'<script[^>]*>(.*?)</script>',text,re.S|re.I)):
              body=html.unescape(m.group(1)).strip()
              if 'João' in body or 'Joao' in body or 'Rosa Costa' in body or 'LYV6-8M3' in body:
                (out/f'script_{i}_{j}.txt').write_text(body,encoding='utf-8')
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Publicar inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familysearch-public-data
          path: familysearch/
          retention-days: 7
          if-no-files-found: error
